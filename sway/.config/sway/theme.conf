#
#          ============================================================
#                            Sway Theme Configuration
#          ============================================================
#                This file controls the visual window manager logic,
#              including border widths, window gaps, active/inactive
#                   color schemes, and system-wide GTK themes.
#          ============================================================

# 1. Gaps, Borders & Fonts
gaps inner 0
gaps outer 0
smart_gaps off
smart_borders off
default_border pixel 1

# Stealth Tabs (Minimal Titlebars)
font pango:sans-serif 9
titlebar_padding 2
titlebar_border_thickness 0

# 2. Window Colors (Stealth Mode)
# class                 border  backgr. text    indicator child_border
client.focused          #89b4fa #1e293b #89b4fa #89b4fa   #89b4fa
client.unfocused        #1e293b #0b172a #cdd6f4 #1e293b   #1e293b
client.focused_inactive #1e293b #0b172a #cdd6f4 #1e293b   #1e293b

# 3. Floating & Popup Rules
for_window [app_id="wofi"] border none
for_window [title="BatteryPopup"] floating enable, border pixel 2, resize set 250 100
for_window [title="CalendarPopup"] floating enable, border pixel 2, move position center, move up 45 ppt
for_window [app_id="pavucontrol"] floating enable, resize set 600 400, move position center
for_window [app_id="nm-connection-editor"] floating enable, resize set 600 400, move position center
for_window [app_id="blueman-manager"] floating enable, resize set 600 400, move position center
for_window [title="Ne1 Control Centre"] floating enable, resize set 60vw 60vh, move position center

# Force the nmtui window to float and center it
for_window [app_id="waybar_wifi"] {
    floating enable
    sticky enable
    resize set 600 400
    move position center
    border pixel 2
}

# --- Ne1 Control Centre Rules ---
for_window [app_id="ne1_cc"] {
    floating enable
    resize set 60vw 60vh
    move position center
    border pixel 3
    corner_radius 12
}

# Apply the neon blue border
for_window [app_id="ne1_cc"] client.floating #89b4fa #1e293b #cdd6f4 #89b4fa #89b4fa
for_window [app_id="ne1_cc"] client.focused #89b4fa #1e293b #cdd6f4 #89b4fa #89b4fa
