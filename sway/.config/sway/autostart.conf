#
#          ============================================================
#                         Sway Autostart Configuration
#          ============================================================
#               This file handles all background processes, daemons,
#               and applications that need to launch automatically
#                       when the Sway session is started.
#          ============================================================

# System Tray Applets (GUI Managers)
exec nm-applet --indicator
exec blueman-applet

# Tiling & Notifications
exec ~/.local/bin/autotiling
exec mako
exec_always python3 ~/.local/bin/waybar_stealth.py &

# OSD & Volume Pipe
exec mkfifo $XDG_RUNTIME_DIR/wobpipe && tail -f $XDG_RUNTIME_DIR/wobpipe | wob
exec_always killall wob; rm -f $XDG_RUNTIME_DIR/wobpipe; mkfifo $XDG_RUNTIME_DIR/wobpipe; tail -f $XDG_RUNTIME_DIR/wobpipe | wob
exec swayosd-server

# Idle Management
exec swayidle -w \
         timeout 300 'swaylock -f -c 000000' \
         timeout 600 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
         before-sleep 'swaylock -f -c 000000'

# Status Bar
bar {
    swaybar_command waybar
}

# Screen sharing portals
exec /usr/libexec/xdg-desktop-portal -r &
exec /usr/libexec/xdg-desktop-portal-wlr -r &
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway
