#
#          ============================================================
#                         Sway Keybindings Configuration
#          ============================================================
#                This file defines all keyboard shortcuts used to
#              manage windows, switch workspaces, launch utilities,
#                       and control the system volume/media.
#          ============================================================

# -- Core System --
floating_modifier $mod normal
bindsym $mod+Return exec $term
bindsym $mod+q kill
bindsym $mod+Shift+c reload
bindsym $mod+Escape exec bash ~/.local/bin/blur_lock.sh
bindsym $mod+Shift+Escape exec systemctl poweroff

# Ne1 Control Centre (Win + /)
bindsym $mod+slash exec bash ~/.local/bin/control_centre.sh

# Power Control Center (Win + Shift + E)
bindsym $mod+Shift+e exec bash ~/.local/bin/power_menu.sh

# -- App Launchers --
bindsym $mod+space exec rofi -show drun
bindsym $mod+w exec brave-browser-stable --disable-gpu
bindsym $mod+e exec nautilus
bindsym $mod+c exec code
bindsym $mod+d exec discord
bindsym $mod+Shift+d exec discord

# -- Media & Hardware Controls --
# Brightness (Win + F2/F3)
bindsym $mod+F2 exec bash -c 'brightnessctl -m -d acpi_video0 set 5%- | cut -d, -f4 | tr -d % > $XDG_RUNTIME_DIR/wobpipe'
bindsym $mod+F3 exec bash -c 'brightnessctl -m -d acpi_video0 set 5%+ | cut -d, -f4 | tr -d % > $XDG_RUNTIME_DIR/wobpipe'

# Audio Volume (Win + F7/F8/F9)
bindsym $mod+F7 exec pamixer -t
bindsym $mod+F8 exec pamixer -d 5 && pamixer --get-volume > $XDG_RUNTIME_DIR/wobpipe
bindsym $mod+F9 exec pamixer -i 5 && pamixer --get-volume > $XDG_RUNTIME_DIR/wobpipe

# Media Playback (Win + F10/F11/F12)
bindsym $mod+F10 exec playerctl previous
bindsym $mod+F11 exec playerctl play-pause
bindsym $mod+F12 exec playerctl next

# Screenshot to Clipboard (Win + Shift + S)
bindsym $mod+Shift+s exec grim -g "$(slurp)" - | wl-copy

# -- Notifications --
# Toggle DND
bindsym $mod+n exec ~/.local/bin/notif_toggle.sh
# View last dismissed notification
bindsym $mod+Shift+n exec makoctl restore

# -- Window Navigation --
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# -- Window Movement --
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# -- Workspace Navigation --
# Move to specific workspace
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4

# Move window to specific workspace
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4

# Cycle through workspaces (Win + Tab / Win + Shift + Tab)
bindsym $mod+Tab workspace next_on_output
bindsym $mod+Shift+Tab workspace prev_on_output

# Native Alt+Tab (Cycles focus through the current layout)
bindsym Mod1+Tab focus next
bindsym Mod1+Shift+Tab focus prev

# Wallpaper Picker (Win + Shift + W)
bindsym $mod+Shift+w exec bash ~/.local/bin/wallpaper_picker.sh

# -- Layout & Tiling --
bindsym $mod+v splitv
bindsym $mod+s layout stacking
bindsym $mod+b layout tabbed
bindsym $mod+t layout toggle split; border pixel 1
bindsym $mod+Shift+space floating toggle
bindsym $mod+a focus parent

# Fullscreen Mode (Native)
bindsym $mod+f fullscreen toggle

# Toggle Waybar Visibility (Win + P)
bindsym $mod+p exec killall -SIGUSR1 waybar

# -- Scratchpad --
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

# -- Resize Mode --
mode "resize" {
    bindsym $left resize shrink width 10px
    bindsym $down resize grow height 10px
    bindsym $up resize shrink height 10px
    bindsym $right resize grow width 10px
    bindsym Left resize shrink width 10px
    bindsym Down resize grow height 10px
    bindsym Up resize shrink height 10px
    bindsym Right resize grow width 10px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"
