#
#          ============================================================
#                          Kitty Terminal Configuration
#          ============================================================
#               This file manages the terminal emulator settings,
#                including font rendering, window opacity, custom 
#                   color schemes, and terminal keybindings.
#          ============================================================

# === Fonts ===
font_family      JetBrainsMono Nerd Font
font_size        12.0

# === Window Layout & Borders ===
# Blends the GNOME Wayland titlebar into the background
wayland_titlebar_color background

# Window border and padding
window_padding_width 4
window_border_width 2pt
draw_minimal_borders yes

# Ne1 Border Colors
active_border_color   #89b4fa
inactive_border_color #313244

# === Ne1 Blueprint Theme (Abyss Variant) ===

# Deep Dark Background
background #09090e
foreground #cdd6f4
cursor     #89b4fa
cursor_text_color #09090e
url_color  #89b4fa

# Selection highlighting
selection_background #89b4fa
selection_foreground #09090e

# Black / Surface
color0  #313244
color8  #45475a

# Red (Aggressive errors)
color1  #ff5e81
color9  #ff5e81

# Green (Neon pop for valid Zsh commands)
color2  #42f587
color10 #42f587

# Yellow (Bright warnings)
color3  #f9e2af
color11 #f9e2af

# Blue (Ne1 Accent for paths/directories)
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #f5c2e7
color13 #f5c2e7

# Cyan (Electric pop for strings/flags)
color6  #86e1fc
color14 #86e1fc

# White
color7  #bac2de
color15 #ffffff
map nvim send_text all [>4;0m
map nvim send_text all [>4;0m
